services:
  cmb-fe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmb-fe
    ports:
      - "${VITE_APP_PORT}:80"
    working_dir: /app
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    networks:
      - cmb-fe-network

networks:
  cmb-fe-network:
    driver: bridge